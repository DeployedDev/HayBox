[env:frame1]
extends = arduino_stm32_base
build_src_filter =
    ${arduino_stm32_base.build_src_filter}
    +<config/frame1>

; Diagnostic build that found the Joybus data pin (PD3; config/frame1/
; pinfinder.cpp). Same board / USB / clock / flash setup as `frame1`; the
; -D FRAME1_PINFINDER flag diverts setup() into the GPIO scanner. Flash it,
; plug into an N64 adapter to hunt, then replug into a PC and read the result
; over USB serial (see the comment at the top of pinfinder.cpp).
[env:frame1_pinfinder]
extends = arduino_stm32_base
build_src_filter =
    ${arduino_stm32_base.build_src_filter}
    +<config/frame1>
build_flags =
    ${arduino_stm32_base.build_flags}
    -D FRAME1_PINFINDER
