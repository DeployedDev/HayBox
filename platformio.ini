[platformio]
name = HayBox
default_envs = pico
extra_configs = config/*/env.ini
src_dir = ./

[env]
build_type = release
custom_firmware_version = 3.1.0
lib_ldf_mode = chain+
build_flags =
    -I src/
    -I include/
    -D 'DEVICE_NAME="${PIOENV}"'
    -D 'FIRMWARE_NAME="${platformio.name}"'
    -D 'FIRMWARE_VERSION="${this.custom_firmware_version}"'
build_src_filter =
    +<src/>
custom_nanopb_protos = 
    +<.pio/libdeps/${PIOENV}/HayBox-proto/config.proto>
custom_nanopb_options =
    --error-on-unmatched
lib_deps =
    nanopb/Nanopb@^0.4.91
    https://github.com/JonnyHaystack/HayBox-proto/archive/refs/tags/v0.1.0.zip

[avr_base]
platform = atmelavr
framework = arduino
build_unflags =
    -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Os
    -fdata-sections
    -ffunction-sections
    -fno-sized-deallocation
    -flto
    -fshort-enums
    -Wl,--gc-sections
    -Wno-unused-variable
    -I HAL/avr/include
    -D PB_BUFFER_ONLY
    -D PB_WITHOUT_64BIT
    -D PB_NO_ERRMSG
    -D PB_CONVERT_DOUBLE_FLOAT
build_src_filter =
    ${env.build_src_filter}
    +<HAL/avr/src>
    -<src/comms/IntegratedDisplay.cpp>
    -<src/core/mode_selection.cpp>
custom_nanopb_options = 
    ${env.custom_nanopb_options}
    --options-file ../../../../HAL/avr/proto/config.options
lib_deps =
    ${env.lib_deps}
    nicohood/Nintendo@^1.4.0
    Wire
    https://github.com/JonnyHaystack/arduino-nunchuk/archive/refs/tags/v1.0.1.zip

[avr_nousb]
extends = avr_base
build_flags =
    ${avr_base.build_flags}
    -I HAL/avr/avr_nousb/include
build_src_filter =
    ${avr_base.build_src_filter}
    +<HAL/avr/avr_nousb/src>

[avr_usb]
extends = avr_base
build_flags =
    ${avr_base.build_flags}
    -I HAL/avr/avr_usb/include
build_src_filter =
    ${avr_base.build_src_filter}
    +<HAL/avr/avr_usb/src>
lib_deps =
    ${avr_base.lib_deps}
    https://github.com/JonnyHaystack/ArduinoJoystickLibrary/archive/refs/tags/v0.0.1.zip
    https://github.com/JonnyHaystack/ArduinoKeyboard/archive/refs/tags/1.0.5.zip

[arduino_pico_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5e87ae34ca025274df25b3303e9e9cb6c120123c
framework = arduino
board = pico
extra_scripts = pre:builder_scripts/arduino_pico.py
debug_tool = cmsis-dap
; upload_protocol = cmsis-dap
monitor_speed = 115200
board_build.core = earlephilhower
board_build.f_cpu = 200000000L
board_build.filesystem_size = 0.5m
build_unflags = -Os
build_flags =
    ${env.build_flags}
    -O3
    -D USE_TINYUSB
    -D CFG_TUSB_CONFIG_FILE=\"tusb_config_pico.h\"
    -D NDEBUG
    -D FASTLED_RP2040_CLOCKLESS_M0_FALLBACK=0
    -Wall
    -Wstack-usage=1024
    -Wno-unused-variable
    -I HAL/pico/include
build_src_filter =
    ${env.build_src_filter}
    +<HAL/pico/src>
platform_packages =
    framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#3.6.3
lib_archive = no
lib_deps =
    ${env.lib_deps}
    https://github.com/JonnyHaystack/joybus-pio/archive/refs/tags/v1.2.3.zip
    https://github.com/JonnyHaystack/nes-pio#73417ba
    https://github.com/JonnyHaystack/arduino-nunchuk/archive/refs/tags/v1.0.1.zip
    https://github.com/JonnyHaystack/Adafruit_TinyUSB_XInput#4b5617b
    https://github.com/FastLED/FastLED#6daa782
    https://github.com/JonnyHaystack/nanopb-arduino/archive/refs/tags/v1.1.1.zip
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    eric-wieser/PacketIO@^0.3.0
    bakercp/CRC32@^2.0.0
    robtillaart/PCF8575@^0.2.2
    TUCompositeHID

[arduino_stm32_base]
; ---------------------------------------------------------------------------
; Frame1 (STM32F303VE) base env.  Arduino framework = STM32duino, USB = TinyUSB
; (so HayBox's Adafruit_TinyUSB-based backends are reusable).
;
; The app lives at 0x08020000 (above the Frame1's 128K DFU bootloader), with the
; vector table relocated to match (VECT_TAB_OFFSET below). Shared by the Frame1
; Heavy and Light.
; ---------------------------------------------------------------------------
platform = ststm32
framework = arduino
; The Frame1's MCU is an STM32F303VE (LQFP100, 512K flash / 64K RAM). No stock
; platform-ststm32 board fits: the only 512K F303 boards are Nucleos that don't
; enable the arduino framework, and the arduino-capable stock F303 boards are
; smaller packages without port E (which the pin map needs). So we ship a custom
; board definition - boards/frame1.json - targeting STM32F303xE, 512K/64K, the
; arduino framework, and STM32duino's 100-pin F303V(D-E) variant. The clock is
; configured in config/frame1/clock.cpp (HSE 8MHz crystal -> 72MHz, USB 48MHz).
board = frame1
board_build.flash_offset = 0x20000          ; app at 0x08020000 (above 128K bootloader)
board_upload.offset_address = 0x08020000
upload_protocol = dfu                        ; flashed with dfu-util (0483:df11)
; Pre: swap Adafruit_TinyUSB's OTG-only STM32 port for our F303 fsdev port (and
; shim the XInput lib) before build. Post: also emit firmware.hex, which embeds
; the 0x08020000 load address for GUI flashers (Frame1 updater, CubeProgrammer).
extra_scripts =
    pre:builder_scripts/patch_tinyusb_stm32.py
    post:builder_scripts/make_hex.py
build_unflags = -Os
build_flags =
    ${env.build_flags}
    -O2
    -D USBCON
    -D USE_TINYUSB
    ; No hardware-UART Serial; let Adafruit TinyUSB's CDC be Serial (as on the pico).
    ; Without this STM32duino maps Serial -> USART (Serial2), which collides with
    ; the TinyUSB CDC's `#define SerialTinyUSB Serial`.
    -D HWSERIAL_NONE
    -D CFG_TUSB_CONFIG_FILE=\"tusb_config_stm32.h\"
    -D HAL_PCD_MODULE_ENABLED
    -D VECT_TAB_OFFSET=0x20000               ; SystemInit sets SCB->VTOR = FLASH_BASE|offset
    -Wno-unused-variable
    -I HAL/stm32/include
build_src_filter =
    ${env.build_src_filter}
    +<HAL/stm32/src>
    -<src/comms/IntegratedDisplay.cpp>   ; needs OLED libs + Persistence; the Frame1 has no display
; SdFat is a transitive Adafruit-TinyUSB dependency (only its MSC/SD examples use
; it) that we don't build; it references a bare global `Serial`, which HWSERIAL_NONE
; removes, so exclude it from dependency resolution.
lib_ignore =
    SdFat - Adafruit Fork
lib_archive = no
lib_deps =
    ${env.lib_deps}
    ; Base Adafruit TinyUSB Arduino layer. arduino-pico bundles this for the pico
    ; build, but STM32duino does not, so TUCompositeHID's <Adafruit_TinyUSB.h>
    ; (and our HAL/stm32 code) need it added explicitly.
    adafruit/Adafruit TinyUSB Library@^3.0.0
    ; XInput backend, same pin as the pico env. It registers its own TinyUSB
    ; app class driver, so CFG_TUD_VENDOR must stay 0 in tusb_config_stm32.h.
    https://github.com/JonnyHaystack/Adafruit_TinyUSB_XInput#4b5617b
    ; Configurator backend (COBS framing) and flash persistence (CRC32), same
    ; pins as the pico env.
    eric-wieser/PacketIO@^0.3.0
    bakercp/CRC32@^2.0.0
    https://github.com/JonnyHaystack/nanopb-arduino/archive/refs/tags/v1.1.1.zip
    TUCompositeHID
